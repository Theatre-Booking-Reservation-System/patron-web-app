<div class="login">
  <div class="login__card">
    <!-- Left half: welcome / booking-journey -->
    <aside class="login__welcome">
      <img class="login__logo" src="assets/logo.png" alt="Sapumal Theatre" />
      <h1 class="login__welcome-title">Welcome Back</h1>
      <p class="login__welcome-sub">Sign in to continue your booking journey.</p>

      <ul class="login__perks">
        <li>
          <span class="login__perk-icon"><mat-icon>confirmation_number</mat-icon></span>
          <span>Book Tickets</span>
        </li>
        <li>
          <span class="login__perk-icon"><mat-icon>event_seat</mat-icon></span>
          <span>Manage Bookings</span>
        </li>
        <li>
          <span class="login__perk-icon"><mat-icon>local_offer</mat-icon></span>
          <span>Exclusive Offers</span>
        </li>
      </ul>
    </aside>

    <!-- Right half: login form -->
    <form class="login__form" (submit)="onSubmit($event)">
      <h2 class="login__heading">Log In</h2>

      <label class="field-label" for="email">Email Address</label>
      <label class="field">
        <mat-icon class="field__icon">mail_outline</mat-icon>
        <input
          id="email"
          type="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          [(ngModel)]="email"
          required
        />
      </label>

      <label class="field-label" for="password">Password</label>
      <label class="field">
        <mat-icon class="field__icon">lock_outline</mat-icon>
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          [(ngModel)]="password"
          required
        />
        <button
          type="button"
          class="field__toggle"
          (click)="togglePassword()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        >
          <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </label>

      @if (error()) {
        <p class="login__error" role="alert"><mat-icon>error_outline</mat-icon> {{ error() }}</p>
      }

      <button type="submit" class="login__submit" [disabled]="loading()">
        @if (loading()) {
          Logging in…
        } @else {
          Log In
        }
      </button>

      <p class="login__signup">Don't have an account? <a routerLink="/register">Sign Up</a></p>
    </form>
  </div>
</div>
